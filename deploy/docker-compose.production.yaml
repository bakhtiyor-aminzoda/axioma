version: '3.8'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres
      - redis

  rails:
    <<: *base
    container_name: axioma_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_NAME=Axioma
      - BRAND_NAME=Axioma
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    container_name: axioma_sidekiq
    restart: always
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_NAME=Axioma
      - BRAND_NAME=Axioma
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: postgres:16-alpine
    container_name: axioma_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-AxiomaSecurePass2026!}

  redis:
    image: redis:7-alpine
    container_name: axioma_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-AxiomaRedis2026!}"]
    volumes:
      - redis_data:/data

  # Evolution API: WhatsApp Gateway for Tajikistan (QR-code scanning)
  evolution_api:
    image: atendux/evolution-api:v2.1.2
    container_name: axioma_whatsapp_gateway
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-AxiomaEvolutionKey2026!}
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD:-AxiomaSecurePass2026!}@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-AxiomaRedis2026!}@redis:6379/1
      - CHATWOOT_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  storage_data:
  evolution_instances:
