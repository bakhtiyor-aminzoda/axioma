version: '3.8'

services:
  base: &base
    image: ghcr.io/bakhtiyor-aminzoda/axioma:${AXIOMA_IMAGE_TAG:-v0.1.0}
    env_file: .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres
      - redis

  rails:
    <<: *base
    container_name: axioma_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_NAME=Axioma
      - BRAND_NAME=Axioma
      - RAILS_SERVE_STATIC_FILES=true
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    container_name: axioma_sidekiq
    restart: always
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_NAME=Axioma
      - BRAND_NAME=Axioma
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    container_name: axioma_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: axioma_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  # Evolution API: WhatsApp Gateway for Tajikistan (QR-code scanning)
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: axioma_whatsapp_gateway
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DOCKER_ENV=true
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CHATWOOT_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  # Axioma SaaS Backend: Admin Portal, Landing API, Outreach & WhatsApp Onboarding
  backend:
    build:
      context: ../../axioma-landing
      dockerfile: Dockerfile.backend
    image: ghcr.io/bakhtiyor-aminzoda/axioma-backend:${AXIOMA_IMAGE_TAG:-latest}
    container_name: axioma_backend
    restart: always
    ports:
      - "127.0.0.1:5051:5051"
    environment:
      - PYTHONIOENCODING=utf-8
      - AXIOMA_ADMIN_PORT=5051
      - AXIOMA_ADMIN_USER=${AXIOMA_ADMIN_USER:-admin}
      - AXIOMA_ADMIN_PASS=${AXIOMA_ADMIN_PASS}
      - AXIOMA_SECRET_KEY=${AXIOMA_SECRET_KEY}
      - CHATWOOT_URL=http://axioma_web:3000
      - CHATWOOT_INTERNAL_URL=http://axioma_web:3000
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - EVOLUTION_URL=http://axioma_whatsapp_gateway:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-Axioma_WhatsApp}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - AXIOMA_ADMIN_PUBLIC_URL=https://admin.axioma.tj
      - CHATWOOT_WEBHOOK_URL=http://axioma_backend:5051/webhooks/chatwoot
    volumes:
      - backend_data:/app/axioma_admin/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - rails
      - evolution_api

volumes:
  postgres_data:
  redis_data:
  storage_data:
  evolution_instances:
  backend_data:
