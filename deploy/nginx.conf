# ==============================================================================
# Axioma Production Nginx Reverse Proxy Configuration
# Domain: axioma.tj (and subdomains: crm, admin, api, app)
# Features: HTTP->HTTPS redirect, Let's Encrypt Certbot ACME challenge,
#           HTTP/2, WebSockets (ActionCable & Baileys), Gzip compression,
#           64MB uploads, internal API routing.
# Target: /etc/nginx/sites-available/axioma
# ==============================================================================

upstream axioma_crm {
    server 127.0.0.1:3000 fail_timeout=0;
}

upstream axioma_admin_backend {
    server 127.0.0.1:5051 fail_timeout=0;
}

upstream axioma_evolution_api {
    server 127.0.0.1:8080 fail_timeout=0;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect & Let's Encrypt ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name axioma.tj www.axioma.tj crm.axioma.tj app.axioma.tj admin.axioma.tj api.axioma.tj;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Main Landing Page & Public Onboarding (axioma.tj & www.axioma.tj)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axioma.tj www.axioma.tj;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/axioma.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axioma.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/axioma-landing;
    index index.html;

    client_max_body_size 16M;

    # Gzip Compression for fast mobile loading in Tajikistan
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Public REST API (lead capture, trial registration)
    location /api/ {
        proxy_pass http://axioma_admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. Axioma CRM Core Application (crm.axioma.tj & app.axioma.tj)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.axioma.tj app.axioma.tj;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/crm.axioma.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.axioma.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;
    underscores_in_headers on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # In-page CRM channels & WhatsApp scanner endpoints reverse-proxied to admin backend
    location ~ ^/(client/channels|api/whatsapp/|api/instagram/|api/telegram/) {
        proxy_pass http://axioma_admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ActionCable WebSocket support
    location /cable {
        proxy_pass http://axioma_crm/cable;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Main Chatwoot App
    location / {
        proxy_pass http://axioma_crm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

# ------------------------------------------------------------------------------
# 4. Axioma Admin & Outreach Control Panel (admin.axioma.tj)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.axioma.tj;

    ssl_certificate /etc/letsencrypt/live/admin.axioma.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.axioma.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    location / {
        proxy_pass http://axioma_admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

# ------------------------------------------------------------------------------
# 5. Evolution WhatsApp API Gateway (api.axioma.tj)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.axioma.tj;

    ssl_certificate /etc/letsencrypt/live/api.axioma.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.axioma.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    location / {
        proxy_pass http://axioma_evolution_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Evolution API live sessions
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
